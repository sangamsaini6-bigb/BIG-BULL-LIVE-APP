name: Build BIG BULL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-big-bull-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Publish APK to repository
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BIG_BULL_Daily_PnL.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/BIG_BULL_Daily_PnL.apk
          git commit -m 'Build BIG BULL APK [skip ci]' || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: BIG_BULL_Daily_PnL_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
