name: Build BIG BULL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'bigbull-project-small.zip'
      - '.github/workflows/build-big-bull-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: |
          rm -rf android
          unzip -q bigbull-project-small.zip
          mv android-app-final android
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIG_BULL_Daily_PnL_APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
