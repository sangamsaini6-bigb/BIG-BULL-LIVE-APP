<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BIG BULL P&L</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#f7f3e8;font-family:Arial,sans-serif}.wrap{max-width:700px;margin:auto;padding:16px}.brand{text-align:center;padding:18px 0 12px}.brand h1{margin:0;color:#d9a441;letter-spacing:1px}.brand p{margin:5px 0 0;color:#8e8e8e;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#111317;border:1px solid #2a2d32;border-radius:16px;padding:14px;margin-bottom:12px}.lab{font-size:11px;color:#9297a0;text-transform:uppercase}.val{font-size:27px;font-weight:800;margin-top:5px}.pos{color:#32d583}.neg{color:#ff5c6c}.gold{color:#e3b84f}.bar{height:10px;background:#24272d;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#d9a441;width:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #30343b;background:#0b0d10;color:white}button{background:#d9a441;color:#0a0a0a;font-weight:800;border:0;margin-top:8px}.small{font-size:12px;color:#a1a6ad;margin-top:6px}.title{font-weight:800;margin-bottom:10px;color:#e3b84f}.hist{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #24272d;font-size:13px}.danger{color:#ff5c6c;font-weight:800}.ok{color:#32d583;font-weight:800}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand"><h1>BIG.BULL</h1><p>DAILY PROFIT / LOSS CONTROL CENTER</p></div><div class="grid"><div class="card"><div class="lab">Today Net</div><div id="today" class="val">$0.00</div></div><div class="card"><div class="lab">This Week</div><div id="week" class="val">$0.00</div></div><div class="card"><div class="lab">This Month</div><div id="month" class="val">$0.00</div></div><div class="card"><div class="lab">Risk Status</div><div id="status" class="val gold" style="font-size:18px">READY</div></div></div><div class="card"><div class="title">Weekly Target</div><div id="wtxt" class="val gold">$0 / $75</div><div class="bar"><div id="wbar" class="fill"></div></div><div id="wpct" class="small">0% complete</div><div id="wremain" class="small">Remaining: $75.00</div></div><div class="card"><div class="title">Add Daily P&L</div><div class="row"><input id="date" type="date"><input id="profit" type="number" step="0.01" placeholder="Profit"><input id="loss" type="number" step="0.01" placeholder="Loss"></div><button onclick="saveRow()">SAVE DAY</button></div><div class="card"><div class="title">Targets & Risk</div><div class="row"><input id="weekly" type="number" step="1" placeholder="Weekly target"><input id="monthly" type="number" step="1" placeholder="Monthly target"><input id="maxloss" type="number" step="1" placeholder="Daily max loss"></div><button onclick="saveSettings()">SAVE SETTINGS</button></div><div class="card"><div class="title">History</div><div id="history" class="small">No entries yet</div></div></div><script>const K='bb_pnl_rows_v1',S='bb_pnl_settings_v1';let rows=JSON.parse(localStorage.getItem(K)||'[]');let set=JSON.parse(localStorage.getItem(S)||'{"weekly":75,"monthly":300,"maxloss":50}');const $=x=>document.getElementById(x),money=n=>(n<0?'-$':'$')+Math.abs(n).toFixed(2),today=()=>new Date().toISOString().slice(0,10);$('date').value=today();$('weekly').value=set.weekly;$('monthly').value=set.monthly;$('maxloss').value=set.maxloss;function saveRow(){let d=$('date').value||today(),p=Math.max(0,+$('profit').value||0),l=Math.max(0,+$('loss').value||0),n=p-l;rows=rows.filter(x=>x.date!==d);rows.push({date:d,profit:p,loss:l,net:n});rows.sort((a,b)=>b.date.localeCompare(a.date));localStorage.setItem(K,JSON.stringify(rows));$('profit').value='';$('loss').value='';render()}function saveSettings(){set={weekly:Math.max(1,+$('weekly').value||75),monthly:Math.max(1,+$('monthly').value||300),maxloss:Math.max(1,+$('maxloss').value||50)};localStorage.setItem(S,JSON.stringify(set));render()}function monday(d){let x=new Date(d+'T12:00:00'),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10)}function monthKey(d){return d.slice(0,7)}function paint(el,n){el.textContent=money(n);el.className='val '+(n>0?'pos':n<0?'neg':'gold')}function render(){let t=today(),wk=monday(t),mk=monthKey(t),tn=0,wn=0,mn=0;for(const r of rows){if(r.date===t)tn+=r.net;if(r.date>=wk)wn+=r.net;if(monthKey(r.date)===mk)mn+=r.net}paint($('today'),tn);paint($('week'),wn);paint($('month'),mn);let pct=Math.max(0,Math.min(100,wn/set.weekly*100));$('wtxt').textContent=money(wn)+' / '+money(set.weekly);$('wbar').style.width=pct+'%';$('wpct').textContent=Math.round(pct)+'% complete';$('wremain').textContent=wn>=set.weekly?'WEEKLY TARGET ACHIEVED':'Remaining: '+money(set.weekly-wn);let st=$('status');if(tn<=-set.maxloss){st.textContent='STOP TRADING';st.className='val danger'}else if(wn>=set.weekly){st.textContent='WEEKLY TARGET HIT';st.className='val ok'}else if(mn>=set.monthly){st.textContent='MONTHLY TARGET HIT';st.className='val ok'}else{st.textContent='READY';st.className='val gold'}$('history').innerHTML=rows.length?rows.map(r=>'<div class="hist"><span>'+r.date+'</span><span class="'+(r.net>=0?'pos':'neg')+'">'+money(r.net)+'</span></div>').join(''):'No entries yet'}render();</script></body></html>
